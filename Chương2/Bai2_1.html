<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Breadcrumb</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

      
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <style>
            .breadcrum.item +.breadcrum.item::before{
                content: ">";
            }
        </style>
    </head>

    <body>
        
            <h3>Đường dẫn chuyên mục</h3>
            <nav class="breadcrumb">
                <a class="breadcrumb-item" href="#">Trang chủ</a>
                <a class="breadcrumb-item" href="#">Thư viện</a>
                <a class="breadcrumb-item" href="#">Giáo trình</a>
                <span class="breadcrumb-item active" aria-current="page">Thiết kế giao diện web</span>
            </nav>
            




        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
