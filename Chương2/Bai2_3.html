<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Title</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <style>
            .demo-box{
                border: 1px solid #000;
                padding: 10px;
                margin-bottom: 20px;
            }
        </style>
    </head>

    <body>
        <h5>Left alignment (this is default)</h5>
        <div class="demo-box">
            <img src="Img/leo1.jpg" alt="" width="100" height="100">
        </div>

        <h5>Center alignment using text alignment classes</h5>
        <div class="demo-box text-center">
            <img src="Img/leo1.jpg" alt="" width="100" height="100">
        </div>

        <h5>Right alignment using float classes</h5>
        <div class="demo-box text-end">
            <img src="Img/leo1.jpg" alt="" width="100" height="100">
        </div>

        <h5>Horizontal alignment using float classes</h5>
        <div class="demo-box clearfix">
            <img src="Img/leo1.jpg" class="float-start" alt="" width="100" height="100">
            <img src="Img/leo1.jpg" class="float-end" alt="" width="100" height="100">
        </div>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
