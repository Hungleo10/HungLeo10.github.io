<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Bài 3.5a</title>
       
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

      
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body>
       <div class="container mt-5 border rounded shadow-lg" style="max-width: 25rem; height: 400px;">
                <form action="/action.page.php" class="was-validated">
                    
                    <div class="mb-3 mt-3">
                        <label for="uname" class="form-label">Tên người dùng:</label>
                        <input type="text" class="form-control" id="uname" name="uname" placeholder="Nhập tên của mày"  required />
                        <div class="valid-feedback">Viết đúng rồi ạ!</div>
                        <div class="invalid-feedback">Điền đầy đủ thông tin</div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="pwd" class="form-label">Mật khẩu:</label>
                        <input type="password" class="form-control" id="pwd" name="pwd" placeholder="Nhập mật khẩu please"  required />
                        <div class="valid-feedback">Viết đúng rồi ạ!</div>
                        <div class="invalid-feedback">Điền đầy đủ thông tin</div>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="mycheck" name="mycheck" required />
                        <label class="form-check-label" for="mycheck"> Đồng ý</label>
                         <div class="valid-feedback">Yesss</div>
                         <div class="invalid-feedback">Bấm vào đây để tiếp tục</div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary d-block mx-auto">Đăng nhập</button>
                    
                </form>
            </div>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
