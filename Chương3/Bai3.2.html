<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Bài 3.2</title>
        
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

     
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    </head>

    <body>
        <div class="container mt-4">
            a)
            <div class="container text-center" style="max-width: 20rem;">
                <div class="btn-group" role="group" aria-label="Button group name">
                    <button
                        type="button"
                        class="btn btn-primary"
                    >
                        Home
                    </button>
                    <button
                        type="button"
                        class="btn btn-primary"
                    >
                        About
                    </button>
                    <button
                        type="button"
                        class="btn btn-primary"
                    >
                        Services
                    </button>
                </div>
            </div>
            <hr>
            b)
            <div class="container text-center" style="max-width: 20rem;">
                <div class="btn-group" role="group" aria-label="Button group name">
                    <button
                        type="button"
                        class="btn btn-secondary"
                    >
                       <i class="bi bi-eye"></i> View
                    </button>
                    <button
                        type="button"
                        class="btn btn-secondary active"
                    >
                        <i class="bi bi-pencil"></i> Edit
                    </button>
                    <button
                        type="button"
                        class="btn btn-secondary"
                    >
                        <i class="bi bi-trash"></i> Delete
                    </button>
                </div>
            </div>
                
            <hr>
            c)
            <div class="btn-toolbar d-flex justify-content-center" role="toolbar" aria-label="Text Formatting Toolbar">
  
              
                <div class="btn-group me-2 ">
                    <button type="button" class="btn btn-outline-secondary" title="In đậm">
                    <i class="bi bi-type-bold"></i>
                    </button>
                    <button type="button" class="btn btn-outline-secondary" title="In nghiêng">
                    <i class="bi bi-type-italic"></i>
                    </button>
                    <button type="button" class="btn btn-outline-secondary" title="Gạch chân">
                    <i class="bi bi-type-underline"></i>
                    </button>
                    <button type="button" class="btn btn-outline-secondary" title="Gạch ngang chữ">
                    <i class="bi bi-type-strikethrough"></i>
                    </button>
                </div>
                <div class="btn-group me-2">
                    <button type="button" class="btn btn-outline-secondary active" title="Căn trái">
                    <i class="bi bi-text-left"></i>
                    </button>
                    <button type="button" class="btn btn-outline-secondary" title="Căn giữa">
                    <i class="bi bi-text-center"></i>
                    </button>
                    <button type="button" class="btn btn-outline-secondary" title="Căn phải">
                    <i class="bi bi-text-right"></i>
                    </button>
                    <button type="button" class="btn btn-outline-secondary" title="Căn đều 2 bên">
                    <i class="bi bi-justify"></i>
                    </button>
                </div>
                <div class="btn-group">
                    <button type="button" class="btn btn-outline-secondary" title="Code">
                    <i class="bi bi-code-slash"></i>
                    </button>
                </div>
            </div>
        </div>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
