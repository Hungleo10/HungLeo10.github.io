<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Bài 3.1</title>
       
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body>
        <div class="container">
            a)
            <h3>Định nghĩa các class buttons</h3>
            <button
                type="button"
                class="btn border"
            >
                Default Button
            </button>
            

            <button
                type="button"
                class="btn btn-primary"
            >
                Primary Button
            </button>
            
            <button
                type="button"
                class="btn btn-success"
            >
                Success Button
            </button>
            
            <button
                type="button"
                class="btn btn-info"
            >
               Info Button
            </button>
            
            <button
                type="button"
                class="btn btn-warning"
            >
                Warning Button
            </button>
            
            <button
                type="button"
                class="btn btn-danger"
            >
                Danger Button
            </button>
            
            <button
                type="button"
                class="btn btn-link text-decoration-none"
            >
                Link Button
            </button>

            <hr>
            
            b)
            <h2 >Button với đường viền</h2>
            <button
                type="button"
                class="btn btn-outline-primary"
            >
                Primary
            </button>

            <button
                type="button"
                class="btn btn-outline-secondary"
            >
                Secondary
            </button>
            
            <button
                type="button"
                class="btn btn-outline-success"
            >
                Success
            </button>

            <button
                type="button"
                class="btn btn-outline-info"
            >
                Info
            </button>

            <button
                type="button"
                class="btn btn-outline-warning"
            >
                Warning
            </button>

            <button
                type="button"
                class="btn btn-outline-danger"
            >
                Danger
            </button>

            <button
                type="button"
                class="btn btn-outline-dark"
            >
                dark
            </button>

            <button
                type="button"
                class="btn btn-outline-light"
            >
                Light
            </button>

            <hr>
            c)
            <h2>Kích thước của button</h2>
            <button
                type="button"
                class="btn btn-primary btn-lg"
            >
                Nút to
            </button>

            <button
                type="button"
                class="btn btn-primary"
            >
               Kích thước mặc định
            </button>
            
            <button
                type="button"
                class="btn btn-primary btn-sm"
            >
                Nút nhỏ
            </button>
            <hr>
            d)
            <h2>Thành phần của Button</h2>
            <a href="#" class="btn btn-success">Button chứa link</a>
            <button type="button" class="btn btn-success">Button</button>
            <input type="button" class="btn btn-success" value="Input Button">
            <button type="submit" class="btn btn-success">Submit Button</button>

            <hr>
            e)
            <h2>Trạng thái của nút</h2>
            <button type="button" class="btn btn-secondary">Nút bình thường</button>
            <button type="button" class="btn btn-secondary active">Nút có thể click</button>
            <button type="button" class="btn btn-secondary disabled">Nút không thể click</button>
            <a href="#" class="btn btn-secondary disabled">Link không thể click</a>

            <hr>
            f)
            <h2>Nút đang load</h2>
            <button type="button" class="btn btn-primary ">
                <span class="spinner-border"></span>
            </button>

            <button type="button" class="btn btn-secondary">
                <span class="spinner-border"></span>
                Loading...
            </button>

            <button type="button" class="btn btn-success disabled">
                <span class="spinner-border spinner-border-sm"></span>
                Loading...
            </button>

            <button type="button" class="btn btn-info disabled">
                <span class="spinner-border spinner-grow-sm"></span>
                loading...
            </button>
        </div>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
